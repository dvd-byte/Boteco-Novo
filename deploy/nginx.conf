# Instalar como /etc/nginx/sites-available/boteco e habilitar em sites-enabled.
# Trocar SEU-DOMINIO.com.br e ativar HTTPS com Certbot antes do uso público.
server {
    listen 80;
    server_name SEU-DOMINIO.com.br www.SEU-DOMINIO.com.br;
    client_max_body_size 6m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sobrescreve o endereço recebido: não confiar em cabeçalhos externos.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
    }
}
